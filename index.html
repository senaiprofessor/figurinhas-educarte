<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figurinhas ✦ Educarte</title>
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome para Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configurações do Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sora: ['Sora', 'sans-serif'],
            poppins: ['Poppins', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          },
          colors: {
            brandBlue: {
              dark: '#1E3A8A',
              DEFAULT: '#3B82F6',
              light: '#60A5FA',
            },
            brandOrange: {
              DEFAULT: '#F97316',
              dark: '#EA580C',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Reset & Custom Styles */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.03); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

    :root {
      --blue-dark: #1E3A8A;
      --blue-mid: #3B82F6;
      --orange-primary: #F97316;
      --orange-dark: #EA580C;
      --glass: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    body {
      background-color: #0f172a;
      background-image: 
        radial-gradient(circle at top right, var(--blue-dark), transparent), 
        radial-gradient(circle at bottom left, #1e1b4b, #0f172a);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .title-font {
      font-family: 'Sora', sans-serif;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.7);
    }

    .glass-card {
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Brilho Laranja nos Botões */
    .btn-orange, .btn-orange-gradient {
      background: linear-gradient(135deg, var(--orange-primary), var(--orange-dark));
      border-radius: 9999px;
      box-shadow: 0 4px 15px rgba(234, 88, 12, 0.3);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-orange:hover, .btn-orange-gradient:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.5);
      filter: brightness(1.08);
    }

    /* Partículas Flutuantes */
    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      animation: floatUp var(--duration) linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10% { opacity: var(--opacity); }
      90% { opacity: var(--opacity); }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* Ambient Blur Circles */
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -10;
      pointer-events: none;
      opacity: 0.35;
      animation: sweep 30s ease-in-out infinite alternate;
    }
    @keyframes sweep {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 90px) scale(1.15); }
      100% { transform: translate(-40px, -50px) scale(0.9); }
    }

    /* Transição de entrada */
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .view-active {
      animation: slideUpFade 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Tremor do Pacote */
    @keyframes tremor {
      0%, 100% { transform: rotate(0deg) scale(1); }
      15%, 55%, 95% { transform: rotate(-3deg) scale(1.04); }
      35%, 75% { transform: rotate(3deg) scale(1.04); }
    }
    .shake-anim {
      animation: tremor 0.15s ease-in-out infinite;
    }

    /* Raridades de Acordo com Design HTML */
    .rarity-common, .glow-comum {
      border: 2px solid #60A5FA;
    }
    .rarity-rare, .glow-rara {
      border: 2px solid #A855F7;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }
    .rarity-legendary, .glow-lendaria {
      border: 2px solid #F59E0B;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
    }
    .rarity-secret, .glow-secreta {
      border: 2px solid #DC2626;
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.5);
    }

    /* Efeito de Flutuação */
    .floating {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Shimmer Effect */
    .shimmer {
      position: relative;
      overflow: hidden;
    }
    .shimmer::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: rotate(45deg);
      animation: shimmer 3s infinite;
    }
    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* Shimmer Badge Secreta */
    .shimmer-badge {
      background: linear-gradient(90deg, #991b1b 20%, #fca5a5 50%, #991b1b 80%);
      background-size: 200% auto;
      animation: shimmer-badge-anim 1.8s linear infinite;
    }
    @keyframes shimmer-badge-anim {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* 3D Flip Card */
    .perspective-1000 { perspective: 1000px; }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1);
      transform-style: preserve-3d;
    }
    .flipped { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 16px;
    }
    .flip-card-back { transform: rotateY(180deg); }

    /* Explosão Radial */
    .burst-particle {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      pointer-events: none;
      animation: burst var(--burst-duration) cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }
    @keyframes burst {
      from { transform: translate(0, 0) scale(1); opacity: 1; }
      to { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* Envelope Visual */
    .pacotinho-envelope {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 3px solid rgba(249, 115, 22, 0.6);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      transition: all 0.3s ease;
    }
    .pacotinho-envelope:hover {
      border-color: rgba(249, 115, 22, 1);
      box-shadow: 0 0 30px rgba(249, 115, 22, 0.35);
    }
  </style>
</head>
<body class="h-full text-white selection:bg-brandOrange selection:text-white flex flex-col justify-between">

  <!-- Orbes de Brilho no Background -->
  <div class="ambient-orb w-[350px] h-[350px] bg-brandBlue-dark top-[5%] left-[5%]"></div>
  <div class="ambient-orb w-[380px] h-[380px] bg-brandOrange-dark top-[60%] right-[5%]"></div>
  <div class="ambient-orb w-[220px] h-[220px] bg-indigo-950 bottom-[10%] left-[25%]"></div>

  <!-- Container de Partículas em Background -->
  <div id="particles-container" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

  <!-- Header / Navbar -->
  <header class="glass-panel sticky top-0 z-50 transition-all border-b border-white/[0.05]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="navigate('home')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brandOrange to-brandBlue flex items-center justify-center font-bold font-sora text-lg shadow-lg shadow-brandBlue/25">
          F
        </div>
        <div>
          <span class="font-sora font-extrabold text-lg sm:text-xl tracking-tight bg-gradient-to-r from-white via-white to-orange-200 bg-clip-text text-transparent">Figurinhas</span>
          <span class="text-xs block text-brandOrange font-semibold uppercase tracking-[0.2em] font-poppins -mt-1">✦ Educarte</span>
        </div>
      </div>

      <!-- Menu Desktop -->
      <nav class="hidden md:flex items-center space-x-8 font-poppins font-medium text-sm">
        <a href="javascript:void(0)" onclick="navigate('home')" class="text-white/80 hover:text-white transition">Início</a>
        <a href="javascript:void(0)" onclick="scrollToShowcase()" class="text-white/60 hover:text-white transition">Raridades</a>
        <div id="desktop-auth-container"></div>
      </nav>

      <!-- Botão Menu Mobile -->
      <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-lg text-white/80 hover:text-white focus:outline-none focus:ring-2 focus:ring-brandOrange" aria-label="Menu principal">
        <i id="menu-icon" class="fa-solid fa-bars text-xl"></i>
      </button>
    </div>

    <!-- Dropdown Menu Mobile -->
    <div id="mobile-menu" class="hidden md:hidden absolute top-18 left-0 right-0 glass-panel border-t border-white/[0.05] p-5 space-y-4 flex flex-col font-poppins font-medium animate-fade-in">
      <a href="javascript:void(0)" onclick="navigate('home'); toggleMobileMenu()" class="text-white/80 py-2 hover:text-white border-b border-white/[0.05]">Início</a>
      <a href="javascript:void(0)" onclick="scrollToShowcase(); toggleMobileMenu()" class="text-white/60 py-2 hover:text-white border-b border-white/[0.05]">Raridades</a>
      <div id="mobile-auth-container" class="flex flex-col space-y-3 pt-2"></div>
    </div>
  </header>

  <!-- Container Principal das Páginas SPA -->
  <main class="relative flex-grow z-10 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full py-10">
    <div id="app-view" class="view-active"></div>
  </main>

  <!-- Rodapé -->
  <footer class="glass-panel border-t border-white/[0.05] py-6 text-center z-10">
    <p class="font-inter text-xs text-white/40 tracking-wider">
      © 2025 Educarte – Todos os direitos reservados.
    </p>
  </footer>

  <!-- Modal Global (Ver Detalhes, Confirmações) -->
  <div id="global-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md hidden opacity-0 transition-all duration-300">
    <div id="modal-content" class="w-full max-w-md glass-panel p-6 sm:p-8 rounded-2xl border border-white/[0.12] shadow-2xl relative transform scale-95 transition-transform duration-300">
    </div>
  </div>

  <!-- Scripts Integrados -->
  <script>
    // --- DADOS E CONSTANTES DO SISTEMA ---
    const USUARIOS = [
      { login: "usuario1", senha: "123456", tipo: "usuario", nome: "Jogador 1" },
      { login: "usuario2", senha: "123456", tipo: "usuario", nome: "Jogador 2" },
      { login: "admin",    senha: "123456", tipo: "admin",   nome: "Administrador" }
    ];

    const FIGURINHAS = [
      {
        id: 1,
        nome: "Arthur Leitão",
        apelido: "O Porquinho",
        emoji: "🐷",
        raridade: "Comum",
        chance: 60,
        cor: "#60A5FA",        // azul claro
        descricao: "O clássico, sempre presente na coleção de toda a galera!"
      },
      {
        id: 2,
        nome: "Emanuel Fuleco",
        apelido: "O Mascote",
        emoji: "⚽🦔",
        raridade: "Rara",
        chance: 25,
        cor: "#A855F7",        // roxo
        descricao: "Raro como um gol espetacular de bicicleta no último minuto!"
      },
      {
        id: 3,
        nome: "Augusto",
        apelido: "O Lesma",
        emoji: "🐌",
        raridade: "Lendária",
        chance: 10,
        cor: "#F59E0B",        // dourado
        descricao: "Lendário e super amado. Devagar ele conquista qualquer baralho!"
      },
      {
        id: 4,
        nome: "Teobaldo",
        apelido: "Misterioso",
        emoji: "💀",
        raridade: "Secreta",
        chance: 5,
        cor: "#DC2626",        // vermelho escuro
        descricao: "Poucos se atrevem a desvendar seu olhar enigmático... Parabéns!"
      }
    ];

    // --- ESTADO REATIVO DO APP ---
    let state = {
      currentUser: null,
      figurinhasAppData: {}, // Ex: { usuario1: { figurinha_id: 2, data: '...' } }
      currentPage: 'home',
      menuOpen: false,
      isDrawing: false,       // controle animação
      tempCardDrawn: null     // figurinha recém-sorteada
    };

    // --- ENTRADA DO APP ---
    window.onload = function() {
      createParticles();
      
      // Carregar sessões locais
      const savedUser = localStorage.getItem('fig_current_user');
      if (savedUser) {
        state.currentUser = JSON.parse(savedUser);
      }

      const savedData = localStorage.getItem('figurinhas_app_data');
      if (savedData) {
        state.figurinhasAppData = JSON.parse(savedData);
        // Garante compatibilidade migrando objetos simples ou registros individuais para arrays
        for (const user in state.figurinhasAppData) {
          if (state.figurinhasAppData[user] && !Array.isArray(state.figurinhasAppData[user])) {
            state.figurinhasAppData[user] = [state.figurinhasAppData[user]];
          }
        }
      } else {
        // Inicializar banco vazio
        state.figurinhasAppData = {};
        localStorage.setItem('figurinhas_app_data', JSON.stringify({}));
      }

      renderNavbar();
      navigate(state.currentPage);
    };

    // --- NAVEGAÇÃO INTERNA (SPA) ---
    function navigate(page) {
      state.currentPage = page;
      state.menuOpen = false;
      document.getElementById('mobile-menu').classList.add('hidden');
      document.getElementById('menu-icon').className = 'fa-solid fa-bars text-xl';

      const viewContainer = document.getElementById('app-view');
      viewContainer.classList.remove('view-active');
      
      // Repetir fluxo para animar entrada
      setTimeout(() => {
        renderPage(page);
        renderNavbar();
        viewContainer.classList.add('view-active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 50);
    }

    function toggleMobileMenu() {
      state.menuOpen = !state.menuOpen;
      const menu = document.getElementById('mobile-menu');
      const icon = document.getElementById('menu-icon');
      if (state.menuOpen) {
        menu.classList.remove('hidden');
        icon.className = 'fa-solid fa-xmark text-xl text-brandOrange';
      } else {
        menu.classList.add('hidden');
        icon.className = 'fa-solid fa-bars text-xl';
      }
    }

    function scrollToShowcase() {
      navigate('home');
      setTimeout(() => {
        const target = document.getElementById('rarities-showcase');
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, 100);
    }

    // --- RENDERIZADORES DE HEADER ---
    function renderNavbar() {
      const desktopAuth = document.getElementById('desktop-auth-container');
      const mobileAuth = document.getElementById('mobile-auth-container');

      const loggedOutHTML = `
        <button onclick="navigate('login')" class="btn-orange-gradient text-white font-poppins px-5 py-2.5 rounded-xl font-semibold flex items-center justify-center space-x-2 text-sm">
          <span>Entrar</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      `;

      if (!state.currentUser) {
        desktopAuth.innerHTML = loggedOutHTML;
        mobileAuth.innerHTML = loggedOutHTML;
        return;
      }

      const { nome, tipo } = state.currentUser;
      const isAdminFlag = tipo === 'admin';

      const navHTML = `
        <div class="flex flex-col md:flex-row items-start md:items-center space-y-4 md:space-y-0 md:space-x-4">
          <span class="text-white/60 text-sm font-inter">Olá, <strong class="text-white font-poppins">${nome}</strong> 👋</span>
          <div class="flex items-center space-x-2 w-full md:w-auto">
            ${isAdminFlag ? `
              <button onclick="navigate('admin')" class="px-3.5 py-2 rounded-xl bg-blue-900/40 text-blue-300 border border-blue-500/20 hover:bg-blue-900/60 transition text-xs font-semibold flex items-center space-x-1">
                <i class="fa-solid fa-gear"></i>
                <span>Admin</span>
              </button>
            ` : `
              <button onclick="navigate('usuario')" class="px-3.5 py-2 rounded-xl bg-orange-950/40 text-orange-200 border border-orange-500/10 hover:bg-orange-950/60 transition text-xs font-semibold flex items-center space-x-1">
                <i class="fa-solid fa-circle-user"></i>
                <span>Coleção</span>
              </button>
            `}
            <button onclick="logout()" class="px-3.5 py-2 rounded-xl bg-white/5 hover:bg-red-500/10 hover:text-red-300 border border-white/10 hover:border-red-500/20 transition text-xs font-medium flex items-center space-x-1">
              <i class="fa-solid fa-door-open"></i>
              <span>Sair</span>
            </button>
          </div>
        </div>
      `;

      desktopAuth.innerHTML = navHTML;
      mobileAuth.innerHTML = navHTML;
    }

    // --- CONTROLLER DAS PÁGINAS ---
    function renderPage(page) {
      const el = document.getElementById('app-view');
      
      switch (page) {
        case 'home':
          el.innerHTML = getHomeHTML();
          setupCardEffects();
          break;
        case 'login':
          el.innerHTML = getLoginHTML();
          break;
        case 'usuario':
          if (!state.currentUser) {
            navigate('login');
          } else {
            el.innerHTML = getUserHTML();
          }
          break;
        case 'admin':
          if (!state.currentUser || state.currentUser.tipo !== 'admin') {
            navigate('home');
          } else {
            el.innerHTML = getAdminHTML();
          }
          break;
        default:
          navigate('home');
      }
    }

    // --- HTML TEMPLATES ---

    // 1. LANDING PAGE
    function getHomeHTML() {
      // preview card de raridades
      const previewCards = FIGURINHAS.map(f => {
        let borderClass = "";
        let tagClass = "border-white/10 bg-white/5";
        let glowClass = "";

        if (f.raridade === "Comum") {
          borderClass = "glow-comum";
          tagClass = "border-sky-400/30 bg-sky-950/40 text-sky-300";
        } else if (f.raridade === "Rara") {
          borderClass = "glow-rara";
          tagClass = "border-purple-400/30 bg-purple-950/40 text-purple-300";
        } else if (f.raridade === "Lendária") {
          borderClass = "glow-lendaria";
          tagClass = "border-amber-400/30 bg-amber-950/40 text-amber-300";
          glowClass = "glow-lendaria";
        } else {
          borderClass = "glow-secreta";
          tagClass = "shimmer-badge text-white";
          glowClass = "glow-secreta";
        }

        return `
          <div class="glass-card rounded-2xl overflow-hidden group hover:-translate-y-2 hover:shadow-2xl duration-300 ${borderClass} p-5 flex flex-col items-center text-center relative max-w-sm mx-auto w-full" data-rarity="${f.raridade}">
            <div class="absolute inset-0 bg-gradient-to-b from-transparent to-black/30 pointer-events-none"></div>
            
            <div class="absolute top-4 right-4 text-xs font-semibold uppercase tracking-widest px-2.5 py-1 rounded-full border ${tagClass} font-poppins">
              ${f.raridade}
            </div>

            <!-- Card Visual Artwork -->
            <div class="w-28 h-28 my-6 flex items-center justify-center text-5xl bg-white/[0.04] border border-white/[0.08] rounded-full relative shadow-inner group-hover:scale-105 duration-500">
              <span class="z-10 group-hover:animate-bounce">${f.emoji}</span>
              <div class="absolute inset-0 bg-radial-gradient from-white/10 to-transparent blur-md"></div>
              <div class="absolute -inset-1 opacity-10 rounded-full blur bg-gradient-to-r from-orange-500 to-blue-500 group-hover:opacity-30 transition duration-500"></div>
            </div>

            <h3 class="font-sora font-semibold text-lg text-white group-hover:text-brandOrange transition duration-300 mt-2">${f.nome}</h3>
            <span class="text-xs text-white/50 font-mono tracking-wider mt-1">"${f.apelido}"</span>
            
            <p class="text-xs text-white/70 font-inter mt-3 line-clamp-2 px-3 leading-relaxed">
              ${f.descricao}
            </p>

            <span class="text-[11px] font-mono tracking-wide text-white/40 block mt-4 border-t border-white/[0.05] pt-3 w-full">
              Probabilidade de Sorteio: <strong class="text-white/80">${f.chance}%</strong>
            </span>
          </div>
        `;
      }).join('');

      return `
        <!-- Hero Section -->
        <section class="flex flex-col items-center text-center justify-center py-12 md:py-20 max-w-4xl mx-auto">
          <div class="inline-flex items-center space-x-2 border border-white/[0.08] bg-white/[0.04] backdrop-blur-md px-4 py-2 rounded-full mb-6 font-poppins text-xs font-semibold tracking-wider text-orange-200">
            <span class="flex h-2 w-2 rounded-full bg-brandOrange animate-pulse"></span>
            <span>NOVO: EVENTO ÁREA DO ALUNO ATIVADO!</span>
          </div>

          <h1 class="font-sora tracking-tight font-extrabold text-4xl sm:text-5xl md:text-6xl text-white leading-tight drop-shadow-md">
            Colecione as Figurinhas dos <br class="hidden sm:inline" />
            <span class="bg-gradient-to-r from-brandOrange via-brandOrange to-brandBlue-light bg-clip-text text-transparent">Alunos da Educarte</span>
          </h1>

          <p class="font-inter text-white/70 max-w-2xl text-sm sm:text-base md:text-lg mt-6 leading-relaxed">
            Seja bem-vindo ao portal oficial da Educarte! Abra pacotinhos digitais para resgatar figurinhas exclusivas baseadas nos perfis criativos dos nossos alunos.

    // 4. ADMIN PANEL HTML
    function getAdminHTML() {
      // Achatar todos os resgates com suporte a arrays de figurinhas por usuário
      const flatResgates = [];
      Object.entries(state.figurinhasAppData).forEach(([login, items]) => {
        const itemsArr = Array.isArray(items) ? items : (items ? [items] : []);
        itemsArr.forEach(item => {
          flatResgates.push({ login, figurinha_id: item.figurinha_id, data: item.data });
        });
      });

      const totalDistribuido = flatResgates.length;

      let distribuicoes = { "Comum": 0, "Rara": 0, "Lendária": 0, "Secreta": 0 };
      flatResgates.forEach(item => {
        const fig = FIGURINHAS.find(f => f.id === item.figurinha_id);
        if (fig) distribuicoes[fig.raridade]++;
      });

      // Cálculo percentual para o gráfico de barras
      const getPct = (rarity) => {
        if (totalDistribuido === 0) return 0;
        return ((distribuicoes[rarity] / totalDistribuido) * 100).toFixed(0);
      };

      // Tabela de registros
      let tableRowsHTML = '';
      if (flatResgates.length === 0) {
        tableRowsHTML = `
          <tr>
            <td colspan="4" class="px-6 py-10 text-center text-white/40 text-xs font-inter leading-relaxed">
              <i class="fa-solid fa-inbox text-2xl mb-2 text-white/20 block"></i>
              Nenhum resgate registrado até o momento.
            </td>
          </tr>
        `;
      } else {
        // Ordenar do mais novo para o mais antigo
        const sortedResgates = [...flatResgates].sort((a, b) => new Date(b.data) - new Date(a.data));
        
        tableRowsHTML = sortedResgates.map(item => {
          const userObj = USUARIOS.find(u => u.login === item.login) || { nome: item.login };

          else if (figObj.raridade === "Rara") rBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-mono border border-purple-450/20 bg-purple-950/20 text-purple-300">RARA</span>`;

          else rBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-mono border border-red-500/30 bg-red-950/40 text-red-300">SECRETA</span>`;

          return `
            <tr class="border-b border-white/[0.04] hover:bg-white/[0.02]/30 transition group">

    // --- LÓGICA DE LOGIN / CADASTRO / LOGOUT ---
    function fillShortcut(type) {
      const uInput = document.getElementById('username');
      const pInput = document.getElementById('password');
      if (type === 'usuario1') {
        uInput.value = 'usuario1';
        pInput.value = '123456';
      } else if (type === 'usuario2') {
        uInput.value = 'usuario2';
        pInput.value = '123456';
      } else {
        uInput.value = 'admin';
        pInput.value = '123456';
      }

      // Login automático instantâneo
      setTimeout(() => {
        loginUser(uInput.value, pInput.value);
      }, 100);
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      loginUser(u, p);
    }

    function loginUser(usr, pass) {
      const matched = USUARIOS.find(u => u.login.toLowerCase() === usr.toLowerCase() && u.senha === pass);
      const errorBox = document.getElementById('login-error');

      if (!matched) {
        if (errorBox) {
          errorBox.classList.remove('hidden');
          errorBox.classList.add('animate-shake');
          setTimeout(() => errorBox.classList.remove('animate-shake'), 400);
        }
        return;
      }

      state.currentUser = matched;
      localStorage.setItem('fig_current_user', JSON.stringify(matched));
      
      if (errorBox) errorBox.classList.add('hidden');

      // Redirecionamento condicional de acordo com perfil
      if (matched.tipo === 'admin') {
        navigate('admin');
      } else {
        navigate('usuario');
      }
    }

    function logout() {
      state.currentUser = null;
      localStorage.removeItem('fig_current_user');
      navigate('home');
    }

    function handleHeroCTA() {
      if (!state.currentUser) {
        navigate('login');
      } else {
        if (state.currentUser.tipo === 'admin') {
          navigate('admin');
        } else {
          navigate('usuario');
        }
      }
    }

    // --- LÓGICA DE SORTEIO DE CARD ---
    function sortearFigurinha() {
      const rand = Math.random() * 100;
      if (rand < 60) return FIGURINHAS.find(f => f.raridade === "Comum");         // 60% chance
      else if (rand < 85) return FIGURINHAS.find(f => f.raridade === "Rara");      // 25% chance
      else if (rand < 95) return FIGURINHAS.find(f => f.raridade === "Lendária");  // 10% chance
      else return FIGURINHAS.find(f => f.raridade === "Secreta");                  // 5% chance
    }

    // --- ANIMAÇÃO DE COMPRA / ABERTURA DO PACOTINHO ---
    function startDrawing() {
      if (state.isDrawing) return;
      state.isDrawing = true;

      // Desabilitar cliques no botão e envelope
      const btn = document.getElementById('draw-btn');
      const envelope = document.getElementById('envelope-card');
      const packContainer = document.getElementById('pacotinho-container');
      
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>Extraindo Energia...</span>`;
      }
      if (envelope) envelope.classList.add('shake-anim');

      // Sorteio imediato por baixo
      const cardSorteado = sortearFigurinha();
      state.tempCardDrawn = cardSorteado;

      // 1ª ETAPA: Tremer (Shake) durante 1.2 segundos
      setTimeout(() => {
        if (envelope) envelope.classList.remove('shake-anim');
        
        // 2ª ETAPA: Explosão de luz e partículas
        triggerExplosion(packContainer);

        // Flash de luz Backdrop
        const flash = document.createElement('div');
        flash.className = 'fixed inset-0 bg-white z-50 pointer-events-none opacity-0';
        document.body.appendChild(flash);
        
        flash.style.transition = 'opacity 0.2s ease-out';
        setTimeout(() => flash.style.opacity = '1', 10);
        setTimeout(() => {
          flash.style.transition = 'opacity 0.6s ease-in';
          flash.style.opacity = '0';
          setTimeout(() => flash.remove(), 600);
        }, 180);

        // Transformar o envelope no card 3D revelador
        reveal3DCardFlow(packContainer, cardSorteado);

      }, 1200);
    }

    function triggerExplosion(container) {
      if (!container) return;
      const rect = container.getBoundingClientRect();
      const xCentral = rect.width / 2;
      const yCentral = rect.height / 2;

      const particleColors = ['#F97316', '#3B82F6', '#A855F7', '#F59E0B', '#10B981', '#DC2626'];

      for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'burst-particle z-40';
        
        const color = particleColors[Math.floor(Math.random() * particleColors.length)];
        p.style.backgroundColor = color;
        p.style.boxShadow = `0 0 8px ${color}`;

        // Coordenadas aleatórias de projeção radial
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 220 + 85; 
        const tx = Math.cos(angle) * radius;
        const ty = Math.sin(angle) * radius;

        p.style.setProperty('--tx', `${tx}px`);
        p.style.setProperty('--ty', `${ty}px`);
        
        const duration = Math.random() * 0.7 + 0.55;
        p.style.setProperty('--burst-duration', `${duration}s`);
        
        p.style.left = `${xCentral}px`;
        p.style.top = `${yCentral}px`;

        container.appendChild(p);
        setTimeout(() => p.remove(), duration * 1000);
      }
    }

    function reveal3DCardFlow(container, card) {
      // Remover estrutura do envelope e injetar layout 3D
      let borderClass = "";
      let tagClass = "";
      
      if (card.raridade === "Comum") {
        borderClass = "glow-comum";
        tagClass = "border-sky-400/30 bg-sky-950/40 text-sky-300";
      } else if (card.raridade === "Rara") {
        borderClass = "glow-rara";
        tagClass = "border-purple-400/30 bg-purple-950/40 text-purple-300";
      } else if (card.raridade === "Lendária") {
        borderClass = "glow-lendaria";
        tagClass = "border-amber-400/30 bg-amber-950/40 text-amber-300";
      } else {
        borderClass = "glow-secreta";
        tagClass = "shimmer-badge text-white";
      }

      const isSecreta = card.raridade === "Secreta";

      // HTML do card 3D
      container.innerHTML = `
        <div class="w-full h-full perspective-1000">
          <div id="flippable-inner" class="flip-card-inner w-full h-full">
            
            <!-- Frente (Verso fictício do Card até dar o Flip) -->
            <div class="flip-card-front w-full h-full bg-gradient-to-tr from-brandBlue-dark to-slate-900 border-2 border-brandOrange/40 rounded-2xl flex flex-col items-center justify-center text-center p-6 shadow-2xl relative">
              <span class="text-4xl animate-pulse text-brandOrange">✦</span>
              <span class="font-sora tracking-widest font-bold text-xs uppercase text-white/50 mt-4">EDU CARDS</span>
              <span class="text-[10px] text-white/30 font-mono mt-1">REVELANDO...</span>
            </div>

            <!-- Trás (Frente Verdadeira do Card de Personagem) -->
            <div class="flip-card-back w-full h-full glass-panel rounded-2xl ${borderClass} p-5 flex flex-col items-center text-center justify-between shadow-2xl relative overflow-hidden">
              
              <!-- Tag/Badge -->
              <div class="w-full flex justify-between items-center mb-1">
                <span class="text-[8px] font-mono text-white/30">ID #${card.id}</span>
                <span id="card-reveal-badge" class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full border ${tagClass} font-poppins">
                  ${isSecreta ? '??? SECRETA ???' : card.raridade}
                </span>
              </div>

              <!-- Artwork -->
              <div class="w-24 h-24 my-1 flex items-center justify-center text-5xl bg-white/[0.03] border border-white/[0.06] rounded-full relative shadow-inner">
                <span id="card-reveal-emoji">${isSecreta ? '❓' : card.emoji}</span>
              </div>

              <!-- Título & Nome -->
              <div class="mb-2">
                <h3 id="card-reveal-name" class="font-sora font-extrabold text-lg text-white tracking-tight">
                  ${isSecreta ? '???' : card.nome}
                </h3>
                <span id="card-reveal-nickname" class="text-[9px] text-brandOrange font-mono font-semibold uppercase tracking-[0.2em]">
                  "${isSecreta ? '???' : card.apelido}"
                </span>
                <p id="card-reveal-description" class="text-[11px] text-white/70 font-inter px-3 mt-2 leading-relaxed">
                  ${isSecreta ? 'Um mistério oculto se move sob a névoa...' : card.descricao}
                </p>
              </div>

              <div class="w-full border-t border-white/[0.05] pt-2 text-[9px] font-mono text-white/30 flex justify-between items-center">
                <span>CAMPUS EDUCARTE</span>
                <span>ANO 2025</span>
              </div>
            </div>

          </div>
        </div>
      `;

      // Executar o Flip 3D (virar) após 150ms
      setTimeout(() => {
        const inner = document.getElementById('flippable-inner');
        if (inner) inner.classList.add('flipped');
      }, 150);

      // Salvar no banco LocalStorage
      const saveDateNow = new Date().toISOString();
      if (!Array.isArray(state.figurinhasAppData[state.currentUser.login])) {
        state.figurinhasAppData[state.currentUser.login] = [];
      }
      state.figurinhasAppData[state.currentUser.login].push({
        figurinha_id: card.id,
        data: saveDateNow
      });
      localStorage.setItem('figurinhas_app_data', JSON.stringify(state.figurinhasAppData));

      // Caso seja SECRETA (Teobaldo), revela em etapas cinematográficas!
      if (isSecreta) {
        setTimeout(() => {
          // Vibrar levemente para efeito
          const back = container.querySelector('.flip-card-back');
          if (back) back.classList.add('animate-shake');

          // Revelação mágica pós 2.2 segundos
          setTimeout(() => {
            if (back) back.classList.remove('animate-shake');
            
            // Troca de nomes com efeitos de faísca
            const textName = document.getElementById('card-reveal-name');
            const textNick = document.getElementById('card-reveal-nickname');
            const textDesc = document.getElementById('card-reveal-description');
            const textEmoji = document.getElementById('card-reveal-emoji');
            const patchBadge = document.getElementById('card-reveal-badge');

            if (textName) {
              textName.innerHTML = `<span class="text-red-500 animate-pulse">${card.nome}</span>`;
            }
            if (textNick) textNick.innerHTML = `"${card.apelido}"`;
            if (textDesc) textDesc.innerHTML = card.descricao;
            if (textEmoji) textEmoji.innerHTML = card.emoji;
            if (patchBadge) patchBadge.innerHTML = '??? SECRETA ???'; // mantém a aura misteriosa

            // Adicionar uma legenda de sucesso
            const subTitle = document.getElementById('draw-btn-container-wrapper');
            if (subTitle) subTitle.innerHTML = `<span class="text-xs text-red-500 font-bold block mt-3 select-none">⚠️ A FIGURINHA MAIS RARA DA HISTÓRIA FOI DESBLOQUEADA!</span>`;
            
            finishUnlockProcess();
          }, 1500);

        }, 800);
      } else {
        setTimeout(() => {
          finishUnlockProcess();
        }, 1100);
      }
    }

    function finishUnlockProcess() {
      state.isDrawing = false;
      
      // Criar caixa de controle para sair/recarregar a aba do usuário
      const wrap = document.getElementById('app-view');

    // --- MOUSE TILT E EFEITO HOLO FOIL PARA FIGURINHAS ---
    function setupCardEffects() {
      // adiciona aos cards de início
      const cards = document.querySelectorAll('#rarities-showcase .glass-card');
      cards.forEach(c => {
        c.addEventListener('mousemove', (e) => handleCardHolo(e, c));
        c.addEventListener('mouseleave', () => resetCardHolo(null, c));
      });
    }

    function handleCardHolo(e, target = null) {
      const card = target || e.currentTarget;
      if (!card) return;
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const px = (x / rect.width) * 100;
      const py = (y / rect.height) * 100;
      
      card.style.setProperty('--px', `${px}%`);
      card.style.setProperty('--py', `${py}%`);

      const rotateX = ((y / rect.height) - 0.5) * -12;
      const rotateY = ((x / rect.width) - 0.5) * 12;

      card.style.transform = `perspective(1000px) scale(1.02) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    }

    function resetCardHolo(e, target = null) {
      const card = target || (e ? e.currentTarget : null);
      if (!card) return;
      card.style.transform = '';
      card.style.setProperty('--px', '0%');
      card.style.setProperty('--py', '0%');
    }

            <button onclick="closeModal()" class="flex-1 py-3 rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 transition text-xs font-semibold uppercase tracking-wide">

    // --- MODAL SYSTEM GERAL ---
    function openModal(html) {
      const modal = document.getElementById('global-modal');
      const content = document.getElementById('modal-content');
      content.innerHTML = `
        <button onclick="closeModal()" class="absolute top-4 right-4 text-white/50 hover:text-white transition p-1.5 focus:outline-none" aria-label="Fechar">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        ${html}
      `;
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.add('opacity-100');
        content.classList.remove('scale-95');
        content.classList.add('scale-100');
      }, 10);
    }

    function closeModal() {
      const modal = document.getElementById('global-modal');
      const content = document.getElementById('modal-content');
      modal.classList.remove('opacity-100');
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
    }

    // --- CRIAÇÃO PARTICULAS FLUTUANTES ---
    function createParticles() {
      const container = document.getElementById('particles-container');
      if (!container) return;
      container.innerHTML = ''; // reset
      const count = 30;

      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        
        const size = Math.random() * 5 + 2; // 2px a 7px
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.left = `${Math.random() * 100}vw`;

        const duration = Math.random() * 20 + 15;
        const opacity = Math.random() * 0.35 + 0.1;
        const delay = Math.random() * -25;

        p.style.setProperty('--duration', `${duration}s`);
        p.style.setProperty('--opacity', opacity);
        p.style.animationDelay = `${delay}s`;

        // algunstintados laranja
        if (Math.random() > 0.7) {
          p.style.backgroundColor = 'rgba(234, 88, 12, 0.45)';
        } else {
          p.style.backgroundColor = 'rgba(255, 255, 255, 0.25)';
        }

        container.appendChild(p);
      }
    }

    // --- FORMATAÇÃO DE DATA EM PORTUGUÊS ---
    function formatDate(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      const opt = { 
        day: '2-digit', 
        month: '2-digit', 
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      };
      return d.toLocaleDateString('pt-BR', opt);
    }
